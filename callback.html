
<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso completato</title>
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  .header {
    width: 100%;
    padding: 100px 0 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .spotify-logo {
    width: 160px;
    height: auto;
    display: block;
  }
  .container {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    padding-bottom: 20vh;
    box-sizing: border-box;
    text-align: center;
  }
  .message {
    color: #a1a1aa;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 1.5;
    max-width: 400px;
    margin: 0;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    display: block;
  }
  
  /* Animation for the static page */
  .icon-bg {
    animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: center;
  }
  .icon-mark {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.3s;
  }
  
  @keyframes scaleIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
  <div class="header">
    <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify" class="spotify-logo" />
  </div>
  
  <div class="container">
    <!-- Success Icon (Filled style) -->
    <svg class="success-icon" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
      <circle class="icon-bg" cx="26" cy="26" r="26" fill="#32D74B" />
      <polyline class="icon-mark" points="14 27 22 35 38 17" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>

    <!-- Success Message -->
    <p class="message">Hai collegato con successo il tuo account Spotify.</p>
  </div>
  
  <script>
    setTimeout(() => { if (window.close) { window.close(); } }, 3500);
  </script>
</body>
</html>
