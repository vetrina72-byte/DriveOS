<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso completato</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #121212;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 90%;
    max-width: 420px;
    padding: 32px 24px;
    border-radius: 16px;
    text-align: center;
    background: #1e1e1e;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .spotify-logo {
    width: 100px;
    height: auto;
    margin: 0 auto 24px;
  }
  h2 {
    font-size: 24px;
    font-weight: 700;
    margin: 16px 0 8px;
  }
  p {
    color: #b3b3b3;
    font-size: 16px;
    line-height: 1.5;
    margin: 0 auto 24px;
    max-width: 300px;
  }
  button {
    margin-top: 10px;
    padding: 12px 24px;
    border-radius: 500px;
    border: 0;
    background: #1DB954;
    color: #000;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
  }
  button:hover {
    transform: scale(1.05);
  }

  .success-animation {
    margin: 20px auto;
  }
  .checkmark {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: block;
    stroke-width: 3;
    stroke: #1DB954;
    stroke-miterlimit: 10;
    box-shadow: inset 0px 0px 0px #1DB954;
    animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
  }
  .checkmark__circle {
    stroke-dasharray: 166;
    stroke-dashoffset: 166;
    stroke-width: 3;
    stroke-miterlimit: 10;
    stroke: #1DB954;
    fill: none;
    animation: stroke .6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
  }
  .checkmark__check {
    transform-origin: 50% 50%;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: stroke .3s cubic-bezier(0.65, 0, 0.45, 1) .8s forwards;
  }
  @keyframes stroke {
    100% { stroke-dashoffset: 0; }
  }
  @keyframes scale {
    0%, 100% { transform: none; }
    50% { transform: scale3d(1.1, 1.1, 1); }
  }
  @keyframes fill {
    100% { box-shadow: inset 0px 0px 0px 40px #1DB954; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify Logo" class="spotify-logo"/>
    
    <div class="success-animation">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
    </div>

    <h2>Accesso completato!</h2>
    <p>Il tuo infotainment è ora collegato. Puoi chiudere questa pagina.</p>
    <button onclick="window.close()">Chiudi</button>
  </div>
  <script>setTimeout(() => { if(window.close) { window.close(); } }, 3500);</script>
</body>
</html>
