
<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso completato</title>
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  .header {
    width: 100%;
    padding: 100px 0 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .spotify-logo {
    width: 160px;
    height: auto;
    display: block;
  }
  .container {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
    padding-bottom: 20vh;
    box-sizing: border-box;
    text-align: center;
  }
  .message {
    color: #a1a1aa;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 1.5;
    max-width: 400px;
    margin: 0;
  }

  .success-icon {
    width: 80px;
    height: 80px;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify" class="spotify-logo" />
  </div>
  
  <div class="container">
    <!-- Success Icon (cutout style) -->
    <svg class="success-icon" viewBox="0 0 48 48" fill="white" xmlns="http://www.w3.org/2000/svg" aria-label="Success checkmark">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M24,0 C10.745,0 0,10.745 0,24 C0,37.255 10.745,48 24,48 C37.255,48 48,37.255 48,24 C48,10.745 37.255,0 24,0 Z M35.707,18.707 C36.098,18.317 36.098,17.683 35.707,17.293 C35.317,16.902 34.683,16.902 34.293,17.293 L23,28.586 L15.707,21.293 C15.317,20.902 14.683,20.902 14.293,21.293 C13.902,21.683 13.902,22.317 14.293,22.707 L22.293,30.707 C22.683,31.098 23.317,31.098 23.707,30.707 L35.707,18.707 Z"/>
    </svg>

    <!-- Success Message -->
    <p class="message">Hai collegato con successo il tuo account Spotify.</p>
  </div>
  
  <script>
    setTimeout(() => { if (window.close) { window.close(); } }, 3500);
  </script>
</body>
</html>
