<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Spotify Auth Callback</title>
    <style>
        body { background-color: #121212; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 2em; text-align: center; }
        .container { max-width: 600px; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #1DB954; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color:#f87171; }
        .success { color:#1DB954; }
        h1 { margin-bottom: 0.5em; }
        p { line-height: 1.6; color: #e5e7eb; }
        a { color: #1DB954; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .url-container {
            background-color: #282828;
            padding: 1.5em;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 1.5em;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 1em;
        }
        .url-text {
            font-size: 1.1em;
            word-break: break-all;
            text-align: left;
            flex-grow: 1;
        }
        .copy-button, .manual-close-button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        .copy-button:hover, .manual-close-button:hover {
            background-color: #1ed760;
        }
        .copy-button:active, .manual-close-button:active {
            transform: scale(0.98);
        }
        .manual-close-button {
            margin-top: 1.5em;
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="message-container" class="container">
        <!-- Content will be set by script -->
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const expiresIn = params.get('expires_in');
            const error = params.get('error');
            const messageContainer = document.getElementById('message-container');

            if (error) {
                console.error('Spotify Auth Error:', error);
                localStorage.setItem('spotify_auth_error', 'Autenticazione negata o annullata. Errore: ' + error);
                messageContainer.innerHTML = `
                    <h1><span class="error">Errore di Autenticazione</span></h1>
                    <p>Spotify ha risposto con un errore: <strong>${error}</strong></p>
                    <p>Questo di solito significa che hai negato l'accesso all'applicazione.</p>
                    <p>Puoi chiudere questa finestra e riprovare.</p>
                `;
            } else if (accessToken && expiresIn) {
                const expiresAt = Date.now() + (parseInt(expiresIn, 10) * 1000);
                localStorage.setItem('spotify_access_token', accessToken);
                localStorage.setItem('spotify_token_expires_at', expiresAt.toString());
                localStorage.removeItem('spotify_auth_error');
                
                messageContainer.innerHTML = `
                    <div class="spinner"></div>
                    <h1><span class="success">Autenticazione Riuscita!</span></h1>
                    <p>Puoi chiudere questa finestra in sicurezza. L'app principale è stata aggiornata.</p>
                    <p>Questa finestra si chiuderà da sola tra pochi secondi.</p>
                    <button id="manual-close-btn" class="manual-close-button">Chiudi Finestra Manualmente</button>
                `;

                document.getElementById('manual-close-btn').addEventListener('click', () => window.close());

                // Try to auto-close after giving the user a moment to read the message.
                setTimeout(() => {
                    // This check prevents errors if the user manually closes the window first.
                    if (window.top && !window.top.closed) {
                        window.close();
                    }
                }, 2500);

            } else {
                const correctUrl = window.location.href.split('#')[0];
                messageContainer.innerHTML = `
                    <h1>Configurazione Obbligatoria</h1>
                    <p>Questa pagina è parte del processo di login con Spotify. Sembra che ci sia un problema di configurazione.</p>
                    <p>L'errore <strong>"INVALID_REDIRECT_URI"</strong> di Spotify, o un errore <strong>"Page Not Found"</strong>, di solito significa che l'URL nel tuo pannello Spotify non è corretto.</p>
                    <p>Copia <strong>esattamente</strong> questo URL qui sotto e incollalo nella sezione "Redirect URIs" della tua app sulla <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener noreferrer">Spotify Developer Dashboard</a>.</p>
                    <div class="url-container">
                        <span class="url-text" id="url-to-copy">${correctUrl}</span>
                        <button class="copy-button" id="copy-btn">Copia</button>
                    </div>
                    <p style="margin-top: 1em; font-size: 0.9em; color: #f87171;">Attenzione: assicurati che finisca con <strong>.html</strong> e non .htm o altro.</p>
                `;

                document.getElementById('copy-btn').addEventListener('click', () => {
                    navigator.clipboard.writeText(correctUrl).then(() => {
                        const btn = document.getElementById('copy-btn');
                        btn.textContent = 'Copiato!';
                        setTimeout(() => { btn.textContent = 'Copia'; }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy: ', err);
                    });
                });
            }
        });
    </script>
</body>
</html>
