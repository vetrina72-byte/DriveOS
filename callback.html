<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Account Collegato</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .header {
    margin-bottom: 28px;
  }
  .spotify-logo {
    width: 140px;
    height: auto;
    display: block;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #111113;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    margin-bottom: 20px;
  }
  .icon-wrap svg {
    width: 100%;
    height: 100%;
  }
  .icon-bg {
    animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: center;
  }
  .icon-mark {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw 0.5s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.25s;
  }
  @keyframes scaleIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p {
    color: #a1a1aa;
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .btn-close {
    background: #1DB954;
    color: #000000;
    border: none;
    font-size: 15px;
    font-weight: 700;
    border-radius: 9999px;
    padding: 12px 28px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
    text-decoration: none;
    display: inline-block;
  }
  .btn-close:active {
    transform: scale(0.96);
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify" class="spotify-logo" />
    </div>
    
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 52 52">
          <circle class="icon-bg" cx="26" cy="26" r="26" fill="#1DB954" />
          <polyline class="icon-mark" points="14 27 22 35 38 17" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1>Collegamento Riuscito</h1>
      <p>L'account Spotify è stato collegato con successo all'infotainment della vettura.</p>
      
      <button class="btn-close" onclick="closeWindow()">Chiudi Scheda</button>
    </div>
  </div>

  <script>
    function closeWindow() {
      try {
        window.close();
      } catch (e) {}
    }
    // Attempt automatic window close gracefully after 3 seconds
    setTimeout(() => {
      try {
        window.close();
      } catch (e) {}
    }, 3000);
  </script>
</body>
</html>
